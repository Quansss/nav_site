<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>迅鲨云</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #263448;
    --border: #334155;
    --primary: #38bdf8;
    --primary-dim: #0ea5e920;
    --text: #f1f5f9;
    --muted: #64748b;
    --guest: #94a3b8;
    --user: #34d399;
    --admin: #f59e0b;
    --danger: #ef4444;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }

  a { color: inherit; text-decoration: none; }

  /* ── Header ── */
  .header-brand {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 2px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  .logo { font-size: 18px; font-weight: 600; color: var(--primary); }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  .user-info { font-size: 13px; color: var(--muted); }
  .user-info .role-badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600; margin-left: 4px;
  }

  /* ── Search Area ── */
  .search-section {
    display: flex; flex-direction: column; align-items: center;
    padding: 60px 24px 40px;
  }
  .search-section h1 { font-size: 36px; font-weight: 700; margin-bottom: 12px; color: var(--text); letter-spacing: 2px; }
  .search-section .welcome { font-size: 18px; font-weight: 400; margin-bottom: 28px; color: var(--primary); letter-spacing: 1px; }

  .search-box {
    position: relative; width: 100%; max-width: 600px;
  }
  .search-box input {
    width: 100%; padding: 14px 20px 14px 46px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text); font-size: 16px;
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-box input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-dim);
  }
  .search-box .search-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none;
  }
  .search-box .ext-btn {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    padding: 4px 10px; border-radius: 6px; font-size: 12px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); cursor: pointer;
  }
  .search-box .ext-btn:hover { color: var(--text); border-color: var(--primary); }

  /* ── Link Grid ── */
  main { max-width: 1100px; margin: 0 auto; padding: 0 24px 60px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  .link-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex; gap: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    text-decoration: none;
    color: inherit;
  }
  .link-card:hover {
    transform: translateY(-2px);
    border-color: var(--primary);
    box-shadow: 0 4px 20px #38bdf820;
  }
  .link-card .favicon {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--surface2); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; overflow: hidden;
  }
  .link-card .favicon img { width: 100%; height: 100%; object-fit: cover; }
  .link-card .info { flex: 1; min-width: 0; }
  .link-card .title {
    font-size: 14px; font-weight: 500; margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .link-card .desc {
    font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cred-row {
    display: flex; gap: 8px; margin-top: 4px;
    flex-wrap: wrap;
  }
  .cred-item {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(56,189,248,0.08);
    border: 1px solid rgba(56,189,248,0.25);
    padding: 1px 4px 1px 6px;
    border-radius: 3px;
    font-size: 11px;
  }
  .cred-label { color: var(--primary); font-weight: 500; }
  .cred-val {
    color: var(--text);
    font-family: ui-monospace, Consolas, monospace;
    max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cred-copy {
    background: transparent; border: none;
    color: var(--primary); cursor: pointer;
    font-size: 11px; padding: 0 4px;
    border-radius: 2px;
  }
  .cred-copy:hover { background: rgba(56,189,248,0.15); }
  .cred-copy.copied { color: #22c55e; }
  details.cred-block {
    background: rgba(56,189,248,0.04);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    margin-bottom: 14px;
  }
  details.cred-block > summary {
    cursor: pointer; color: var(--primary); font-size: 13px; font-weight: 500;
    list-style: none;
  }
  details.cred-block > summary::before { content: '🔑 '; }
  details.cred-block[open] > summary::before { content: '🔓 '; }
  details.cred-block .cred-note { font-size: 11px; color: var(--muted); margin: 4px 0 8px; }
  .link-card .card-actions {
    position: absolute; top: 8px; right: 8px;
    display: none; gap: 4px;
  }
  .link-card:hover .card-actions { display: flex; }
  .card-actions button {
    padding: 3px 8px; border-radius: 5px; font-size: 11px;
    border: none; cursor: pointer; transition: all 0.15s;
  }
  .card-actions .btn-edit {
    background: var(--surface2); color: var(--muted);
  }
  .card-actions .btn-edit:hover { color: var(--primary); border: 1px solid var(--primary); }
  .card-actions .btn-del {
    background: var(--surface2); color: var(--muted);
  }
  .card-actions .btn-del:hover { color: var(--danger); border: 1px solid var(--danger); }

  /* ── Badge ── */
  .vis-badge {
    display: inline-block; padding: 2px 7px; border-radius: 10px;
    font-size: 10px; font-weight: 600; margin-left: auto; flex-shrink: 0;
  }
  .vis-badge.guest { background: #94a3b820; color: var(--guest); }
  .vis-badge.user  { background: #34d39920; color: var(--user); }
  .vis-badge.admin { background: #f59e0b20; color: var(--admin); }

  /* ── Category tag ── */
  .cat-tag {
    font-size: 10px; color: var(--muted); margin-right: 6px;
  }

  /* ── Empty ── */
  .empty {
    text-align: center; padding: 60px; color: var(--muted);
    font-size: 15px;
  }
  .empty .hint { margin-top: 8px; font-size: 13px; }

  /* ── Buttons ── */
  .btn {
    padding: 8px 16px; border-radius: 8px; font-size: 13px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); cursor: pointer; transition: all 0.15s;
  }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn-primary {
    background: var(--primary); border-color: var(--primary); color: #0f172a; font-weight: 600;
  }
  .btn-primary:hover { background: #7dd3fc; border-color: #7dd3fc; }
  .btn-danger { color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; background: #00000080;
    display: none; align-items: center; justify-content: center;
    z-index: 1000; backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px; width: 90%; max-width: 480px;
    box-shadow: 0 20px 60px #00000060;
  }
  .modal h2 { font-size: 18px; margin-bottom: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px 12px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px;
    outline: none; transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--primary);
  }
  .form-group textarea { resize: vertical; min-height: 70px; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  /* ── Admin Panel ── */
  .admin-panel {
    border-top: 1px solid var(--border);
    max-width: 1100px; margin: 40px auto 0; padding: 24px;
  }
  .admin-panel h2 { font-size: 16px; margin-bottom: 16px; }
  .admin-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .admin-tab {
    padding: 6px 14px; border-radius: 8px; font-size: 13px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); cursor: pointer;
  }
  .admin-tab.active { background: var(--primary-dim); border-color: var(--primary); color: var(--primary); }

  .user-list { display: flex; flex-direction: column; gap: 8px; }
  .user-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px;
  }
  .user-row .uname { flex: 1; font-size: 14px; }
  .user-row select {
    padding: 4px 8px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-size: 12px;
  }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    padding: 10px 20px; border-radius: 8px; font-size: 14px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); z-index: 9999;
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.err { border-color: var(--danger); color: var(--danger); }
  .toast.ok { border-color: var(--user); color: var(--user); }

  /* ── Auth Modal ── */
  #authModal .modal { max-width: 380px; }
  .auth-tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    background: var(--surface2); border-radius: 10px; padding: 4px;
  }
  .auth-tab {
    flex: 1; padding: 8px; background: transparent; border: none;
    color: var(--muted); font-size: 14px; font-weight: 500;
    border-radius: 7px; cursor: pointer; transition: all 0.15s;
  }
  .auth-tab.active { background: var(--primary); color: #0f172a; }
  .auth-tab:hover:not(.active) { color: var(--text); }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .search-section h1 { font-size: 22px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="header-brand">迅鲨云</div>
  <div class="header-actions">
    <span class="user-info" id="userInfo"></span>
    <button class="btn" id="addBtn" style="display:none">+ 发布链接</button>
    <button class="btn" id="changePwBtn" style="display:none">修改密码</button>
    <button class="btn" id="adminBtn" style="display:none">管理</button>
    <button class="btn" id="loginBtn">登录</button>
    <button class="btn" id="registerBtn">注册</button>
    <button class="btn" id="logoutBtn" style="display:none">退出</button>
  </div>
</header>

<!-- Search -->
<section class="search-section">
  <h1>迅鲨云</h1>
  <p class="welcome">欢迎您！</p>
  <div class="search-box">
    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="searchInput" placeholder="搜索链接，或直接回车跳转到站外搜索…" autocomplete="off">
    <button class="ext-btn" id="extSearchBtn">站外搜</button>
  </div>
</section>

<!-- Main Content -->
<main>
  <div class="grid" id="linkGrid"></div>
  <div class="empty" id="emptyState" style="display:none">
    <div>暂无收藏链接</div>
    <div class="hint">登录后可以发布链接</div>
  </div>
</main>

<!-- Admin Panel -->
<div class="admin-panel" id="adminPanel" style="display:none">
  <h2>管理面板</h2>
  <div class="admin-tabs">
    <button class="admin-tab active" data-tab="links">链接管理</button>
    <button class="admin-tab" data-tab="pending">待审核用户</button>
    <button class="admin-tab" data-tab="users">用户管理</button>
  </div>
  <div id="adminContent"></div>
</div>

<!-- Add/Edit Link Modal -->
<div class="modal-overlay" id="linkModal">
  <div class="modal">
    <h2 id="linkModalTitle">发布链接</h2>
    <input type="hidden" id="editLinkId">
    <div class="form-group">
      <label>标题 *</label>
      <input type="text" id="inTitle" placeholder="例如：GitHub">
    </div>
    <div class="form-group">
      <label>网址 *</label>
      <input type="url" id="inUrl" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>描述</label>
      <textarea id="inDesc" placeholder="简短描述（可选）"></textarea>
    </div>
    <details class="cred-block">
      <summary>凭据（账户/密码）</summary>
      <div class="cred-note">仅创建者和管理员可见，不填请留空</div>
      <div class="form-group">
        <label>账户</label>
        <input type="text" id="inUsername" placeholder="登录用户名（可选）">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="text" id="inPassword" placeholder="登录密码（可选）">
      </div>
    </details>
    <div class="form-group">
      <label>分类</label>
      <input type="text" id="inCat" placeholder="例如：开发、搜索、社区">
    </div>
    <div class="form-group">
      <label>可见范围</label>
      <select id="inVis">
        <option value="user">用户可见</option>
        <option value="guest">游客可见</option>
        <option value="admin">管理员可见</option>
      </select>
    </div>
    <div class="form-group">
      <label>排序值</label>
      <input type="number" id="inSortOrder" value="0" min="0" step="10" style="width:100px">
      <span style="color:#999;font-size:12px">数字越小越靠前，可配合↑↓按钮微调</span>
    </div>
    <div class="form-actions">
      <button class="btn" id="cancelLinkBtn">取消</button>
      <button class="btn btn-primary" id="saveLinkBtn">保存</button>
    </div>
  </div>
</div>

<!-- Auth Modal (Login/Register) -->
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">登录</button>
      <button class="auth-tab" data-tab="register">注册</button>
    </div>
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="authEmail" placeholder="user@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="authPass" placeholder="至少 6 位" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAuth()">
    </div>
    <div class="form-actions">
      <button class="btn" id="cancelAuthBtn">取消</button>
      <button class="btn btn-primary" id="authSubmitBtn" onclick="doAuth()">登录</button>
    </div>
    
  </div>
</div>

<!-- Change Password Modal -->
<div class="modal-overlay" id="changePwModal">
  <div class="modal">
    <h2>修改密码</h2>
    <div class="form-group">
      <label>旧密码</label>
      <input type="password" id="oldPw" placeholder="当前密码" autocomplete="current-password">
    </div>
    <div class="form-group">
      <label>新密码</label>
      <input type="password" id="newPw" placeholder="至少 6 位" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>确认新密码</label>
      <input type="password" id="newPw2" placeholder="再输一次" autocomplete="new-password">
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px">
      <button class="btn" onclick="closeChangePw()">取消</button>
      <button class="btn btn-primary" id="changePwSubmitBtn" onclick="submitChangePw()">保存</button>
    </div>
  </div>
</div>

<!-- Admin Reset Password Modal -->
<div class="modal-overlay" id="resetPwModal">
  <div class="modal">
    <h2>重置用户密码</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:14px" id="resetPwEmail"></p>
    <div class="form-group">
      <label>新密码</label>
      <input type="password" id="resetNewPw" placeholder="至少 6 位" autocomplete="new-password">
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px">
      <button class="btn" onclick="closeResetPw()">取消</button>
      <button class="btn btn-primary" onclick="submitResetPw()">重置</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let state = {
  user: null,
  links: [],
  q: '',
  currentTab: 'links',
  authTab: 'login',
};

// ── API ──────────────────────────────────────────────────────────────────────
function token() { return localStorage.getItem('nav_token') || ''; }
function authHeaders() { return { 'Authorization': 'Bearer ' + token() }; }

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...authHeaders(), ...opts.headers }
  });
  if (r.status === 401) { logout(); throw new Error('未登录'); }
  if (r.status === 403) throw new Error('权限不足');
  if (r.status === 404) throw new Error('资源不存在');
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    throw new Error(j.detail || '请求失败');
  }
  return r.json();
}

// ── Toast ────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Render ───────────────────────────────────────────────────────────────────
async function copyText(elemId, btn) {
  const el = document.getElementById(elemId);
  if (!el) return;
  const text = el.textContent;
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch(e) { /* fall through to legacy */ }
  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch(e2) { ok = false; }
  }
  if (ok) {
    const orig = btn.textContent;
    btn.textContent = '✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1200);
  } else {
    toast('复制失败：请手动复制', 'err');
  }
}

function renderLinks() {
  const grid = document.getElementById('linkGrid');
  const empty = document.getElementById('emptyState');
  let links = state.links;

  if (!links.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = links.map(l => {
    const badge = `<span class="vis-badge ${l.visibility}">${visLabel(l.visibility)}</span>`;
    const canEdit = l.can_edit;
    const fav = l.favicon
      ? `<img src="${l.favicon}" onerror="this.parentElement.innerText='🔗'" alt="">`
      : '🔗';
    return `
    <a class="link-card" href="${l.url}" target="_blank" rel="noopener">
      <div class="favicon">${fav}</div>
      <div class="info">
        <div class="title">${esc(l.title)}${l.category ? `<span class="cat-tag">#${esc(l.category)}</span>` : ''}</div>
        <div class="desc">${esc(l.description || l.url)}</div>
        ${l.has_credentials ? `
        <div class="cred-row">
          ${l.username ? `<div class="cred-item"><span class="cred-label">账户</span><span class="cred-val" id="uname-${l.id}">${esc(l.username)}</span><button class="cred-copy" onclick="event.preventDefault();event.stopPropagation();copyText('uname-${l.id}', this)" title="复制账户">📋</button></div>` : ''}
          ${l.password ? `<div class="cred-item"><span class="cred-label">密码</span><span class="cred-val" id="pwd-${l.id}">${esc(l.password)}</span><button class="cred-copy" onclick="event.preventDefault();event.stopPropagation();copyText('pwd-${l.id}', this)" title="复制密码">📋</button></div>` : ''}
        </div>` : ''}
      </div>
      ${badge}
      ${canEdit ? `
      <div class="card-actions" onclick="event.preventDefault(); event.stopPropagation()">
        <button class="btn-edit" onclick="moveLink(${l.id}, -1)" title="上移">↑</button>
        <button class="btn-edit" onclick="moveLink(${l.id}, 1)" title="下移">↓</button>
        <button class="btn-edit" onclick="openEditLink(${l.id})">编辑</button>
        <button class="btn-del" onclick="deleteLink(${l.id})">删除</button>
      </div>` : ''}
    </a>`;
  }).join('');
}
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function visLabel(v) {
  return { guest: '游客', user: '用户', admin: '管理员' }[v] || v;
}

function updateUI() {
  const u = state.user;
  document.getElementById('loginBtn').style.display = u ? 'none' : '';
  document.getElementById('registerBtn').style.display = u ? 'none' : '';
  document.getElementById('logoutBtn').style.display = u ? '' : 'none';
  document.getElementById('addBtn').style.display = u?.role === 'admin' ? '' : 'none';
  document.getElementById('changePwBtn').style.display = u ? '' : 'none';
  document.getElementById('adminBtn').style.display = u?.role === 'admin' ? '' : 'none';

  const ui = document.getElementById('userInfo');
  if (u) {
    const roleColors = { admin: 'var(--admin)', user: 'var(--user)' };
    const roleLabels = { admin: '管理员', user: '用户' };
    const display = u.email || u.username || '用户';
    ui.innerHTML = `${esc(display)}<span class="role-badge" style="background:${roleColors[u.role]}20;color:${roleColors[u.role]}">${roleLabels[u.role]}</span>`;
  } else {
    ui.innerHTML = '';
  }

  renderLinks();
}

// ── Load Links ───────────────────────────────────────────────────────────────
async function loadLinks() {
  try {
    const links = await api(`/api/links?q=${encodeURIComponent(state.q)}`);
    state.links = links;
  } catch(e) {
    state.links = [];
  }
  updateUI();
}

// ── Auth ─────────────────────────────────────────────────────────────────────
async function checkSession() {
  const t = token();
  if (!t) { state.user = null; updateUI(); return; }
  try {
    state.user = await api('/api/auth/me');
    updateUI();
  } catch {
    localStorage.removeItem('nav_token');
    state.user = null;
    state.links = [];
    renderLinks();
    updateUI();
    loadLinks();
  }
}

function openAuth(tab) {
  tab = tab || 'login';
  document.getElementById('authModal').classList.add('show');
  switchAuthTab(tab);
  document.getElementById('authEmail').value = '';
  document.getElementById('authPass').value = '';
  setTimeout(() => document.getElementById('authEmail').focus(), 50);
}

function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  const btn = document.getElementById('authSubmitBtn');
  btn.textContent = tab === 'register' ? '注册' : '登录';
  state.authTab = tab;
}

async function doAuth() {
  const tab = state.authTab || 'login';
  const email = document.getElementById('authEmail').value.trim();
  const p = document.getElementById('authPass').value;
  if (!email || !p) return toast('请填写邮箱和密码', 'err');
  const path = tab === 'register' ? '/api/auth/register' : '/api/auth/login';
  try {
    const res = await api(path, {
      method: 'POST',
      body: JSON.stringify({ email: email, password: p })
    });
    if (tab === 'register' && res.registered) {
      document.getElementById('authModal').classList.remove('show');
      toast(res.message || '注册申请已提交，请等待管理员审核');
      return;
    }
    localStorage.setItem('nav_token', res.access_token);
    state.user = res.user;
    document.getElementById('authModal').classList.remove('show');
    updateUI();
    await loadLinks();
    toast('登录成功');
  } catch(e) {
    toast(e.message, 'err');
  }
}

function logout() {
  localStorage.removeItem('nav_token');
  state.user = null;
  state.links = [];
  renderLinks();
  updateUI();
  closeModal();
  loadLinks();
  toast('已退出');
}

// ── Change Password ─────────────────────────────────────────────────────────────────
function openChangePw() {
  document.getElementById('oldPw').value = '';
  document.getElementById('newPw').value = '';
  document.getElementById('newPw2').value = '';
  document.getElementById('changePwModal').classList.add('show');
  setTimeout(() => document.getElementById('oldPw').focus(), 50);
}

function closeChangePw() {
  document.getElementById('changePwModal').classList.remove('show');
}

async function submitChangePw() {
  const oldPw = document.getElementById('oldPw').value;
  const newPw = document.getElementById('newPw').value;
  const newPw2 = document.getElementById('newPw2').value;
  if (!oldPw) return toast('请输入旧密码', 'err');
  if (!newPw || newPw.length < 6) return toast('新密码至少 6 位', 'err');
  if (newPw !== newPw2) return toast('两次输入的新密码不一致', 'err');
  try {
    await api('/api/me/password', {
      method: 'POST',
      body: JSON.stringify({ old_password: oldPw, new_password: newPw })
    });
    closeChangePw();
    toast('密码已修改，请重新登录');
    setTimeout(() => { localStorage.removeItem('nav_token'); state.user = null; updateUI(); loadLinks(); }, 800);
  } catch(e) {
    toast(e.message, 'err');
  }
}

function closeResetPw() {
  document.getElementById('resetPwModal').classList.remove('show');
}

let _resetPwUid = null;
function openResetPw(uid, email) {
  _resetPwUid = uid;
  document.getElementById('resetPwEmail').textContent = '用户：' + email;
  document.getElementById('resetNewPw').value = '';
  document.getElementById('resetPwModal').classList.add('show');
  setTimeout(() => document.getElementById('resetNewPw').focus(), 50);
}

async function submitResetPw() {
  const newPw = document.getElementById('resetNewPw').value;
  if (!newPw || newPw.length < 6) return toast('新密码至少 6 位', 'err');
  try {
    await api(`/api/admin/users/${_resetPwUid}/reset-password`, {
      method: 'POST',
      body: JSON.stringify({ new_password: newPw })
    });
    closeResetPw();
    toast('已重置密码');
  } catch(e) {
    toast(e.message, 'err');
  }
}

// ── Link CRUD ────────────────────────────────────────────────────────────────
function openAddLink() {
  document.getElementById('linkModalTitle').textContent = '发布链接';
  document.getElementById('editLinkId').value = '';
  document.getElementById('inTitle').value = '';
  document.getElementById('inUrl').value = '';
  document.getElementById('inDesc').value = '';
  document.getElementById('inCat').value = '';
  document.getElementById('inVis').value = 'user';
  document.getElementById('inSortOrder').value = '0';
  document.getElementById('inUsername').value = '';
  document.getElementById('inPassword').value = '';
  document.querySelector('.cred-block').open = false;
  document.getElementById('linkModal').classList.add('show');
}

function openEditLink(id) {
  const l = state.links.find(x => x.id === id);
  if (!l) return;
  document.getElementById('linkModalTitle').textContent = '编辑链接';
  document.getElementById('editLinkId').value = id;
  document.getElementById('inTitle').value = l.title;
  document.getElementById('inUrl').value = l.url;
  document.getElementById('inDesc').value = l.description;
  document.getElementById('inCat').value = l.category;
  document.getElementById('inUsername').value = l.username || '';
  document.getElementById('inPassword').value = l.password || '';
  // 有凭据时自动展开凭据块
  document.querySelector('.cred-block').open = !!(l.username || l.password);
  document.getElementById('inVis').value = l.visibility;
  document.getElementById('inSortOrder').value = l.sort_order != null ? l.sort_order : 0;
  document.getElementById('linkModal').classList.add('show');
}

async function saveLink() {
  const id = document.getElementById('editLinkId').value;
  const data = {
    title: document.getElementById('inTitle').value.trim(),
    url: document.getElementById('inUrl').value.trim(),
    description: document.getElementById('inDesc').value.trim(),
    category: document.getElementById('inCat').value.trim(),
    visibility: document.getElementById('inVis').value,
    username: document.getElementById('inUsername').value,
    password: document.getElementById('inPassword').value,
    sort_order: parseInt(document.getElementById('inSortOrder').value || '0', 10) || 0,
  };
  if (!data.title || !data.url) return toast('标题和网址不能为空', 'err');
  if (!/^https?:\/\//i.test(data.url)) data.url = 'https://' + data.url;

  // Try to get favicon
  try {
    const u = new URL(data.url);
    data.favicon = `${u.origin}/favicon.ico`;
  } catch {}

  try {
    if (id) {
      await api(`/api/links/${id}`, { method: 'PUT', body: JSON.stringify(data) });
      toast('更新成功');
    } else {
      await api('/api/links', { method: 'POST', body: JSON.stringify(data) });
      toast('发布成功');
    }
    document.getElementById('linkModal').classList.remove('show');
    await loadLinks();
  } catch(e) {
    toast(e.message, 'err');
  }
}

async function deleteLink(id) {
  if (!confirm('确定删除？')) return;
  try {
    await api(`/api/links/${id}`, { method: 'DELETE' });
    toast('已删除');
    await loadLinks();
  } catch(e) {
    toast(e.message, 'err');
  }
}

// 上移/下移：dir=-1 上移，dir=1 下移（仅管理员）
async function moveLink(id, dir) {
  const idx = state.links.findIndex(x => x.id === id);
  if (idx < 0) return;
  const target = idx + dir;
  if (target < 0 || target >= state.links.length) return;
  const arr = state.links.map(x => x.id);
  [arr[idx], arr[target]] = [arr[target], arr[idx]];
  try {
    await api('/api/links/reorder', {
      method: 'PUT',
      body: JSON.stringify({ ids: arr })
    });
    await loadLinks();
  } catch(e) {
    toast(e.message, 'err');
  }
}

// ── Admin Panel ─────────────────────────────────────────────────────────────
function showAdminPanel(show) {
  const panel = document.getElementById('adminPanel');
  panel.style.display = show ? '' : 'none';
  if (show) renderAdmin();
}

function renderAdmin() {
  if (state.currentTab === 'links') renderAdminLinks();
  else if (state.currentTab === 'pending') renderPendingUsers();
  else renderAdminUsers();
}

function renderAdminLinks() {
  const el = document.getElementById('adminContent');
  const allLinks = state.links;
  el.innerHTML = `
    <div style="margin-bottom:12px"><button class="btn btn-primary" onclick="openAddLink()">+ 新增链接</button></div>
    <div class="grid" style="grid-template-columns:1fr">
    ${allLinks.map(l => `
      <div class="link-card" style="cursor:default">
        <div class="favicon">🔗</div>
        <div class="info">
          <div class="title">${esc(l.title)} <span class="vis-badge ${l.visibility}">${visLabel(l.visibility)}</span></div>
          <div class="desc">${esc(l.url)}</div>
        </div>
        <div style="margin-left:auto;display:flex;gap:6px">
          <button class="btn" onclick="openEditLink(${l.id})" style="padding:4px 10px;font-size:12px">编辑</button>
          <button class="btn btn-danger" onclick="deleteLink(${l.id})" style="padding:4px 10px;font-size:12px">删除</button>
        </div>
      </div>
    `).join('')}
    </div>
  `;
}

async function renderPendingUsers() {
  const el = document.getElementById('adminContent');
  try {
    const users = await api('/api/admin/pending-users');
    if (!users.length) {
      el.innerHTML = `<div style="color:var(--muted);text-align:center;padding:40px">暂无待审核用户</div>`;
      return;
    }
    el.innerHTML = `
      <div class="user-list">
      ${users.map(u => `
        <div class="user-row" style="align-items:center">
          <div>
            <div class="uname">${esc(u.email)}</div>
            <div style="font-size:12px;color:var(--muted)">ID: ${u.id} · ${u.created_at}</div>
          </div>
          <div style="margin-left:auto;display:flex;gap:6px">
            <button class="btn btn-primary" onclick="approveUser(${u.id}, 'approve')" style="padding:4px 12px;font-size:12px">通过</button>
            <button class="btn btn-danger" onclick="approveUser(${u.id}, 'reject')" style="padding:4px 12px;font-size:12px">拒绝</button>
          </div>
        </div>
      `).join('')}
      </div>
    `;
  } catch(e) {
    el.innerHTML = `<div style="color:var(--danger)">${e.message}</div>`;
  }
}

async function approveUser(uid, action) {
  try {
    await api(`/api/admin/users/${uid}/approve`, {
      method: 'POST',
      body: JSON.stringify({ action })
    });
    toast(action === 'approve' ? '已批准' : '已拒绝');
    renderPendingUsers();
  } catch(e) {
    toast(e.message, 'err');
  }
}

async function renderAdminUsers() {
  const el = document.getElementById('adminContent');
  try {
    const users = await api('/api/admin/users');
    el.innerHTML = `
      <div class="user-list">
      ${users.map(u => `
        <div class="user-row">
          <span class="uname">${esc(u.email)}</span>
          <span style="font-size:12px;color:var(--muted)">ID: ${u.id} · ${u.status || ''}</span>
          <select onchange="changeRole(${u.id}, this.value)">
            <option value="admin" ${u.role==='admin'?'selected':''}>管理员</option>
            <option value="user" ${u.role==='user'?'selected':''}>用户</option>
          </select>
          ${u.email !== '971954959@qq.com' ? `
            <button class="btn" onclick="openResetPw(${u.id}, '${esc(u.email)}')" style="padding:4px 10px;font-size:12px">重置密码</button>
            <button class="btn btn-danger" onclick="deleteUser(${u.id})" style="padding:4px 10px;font-size:12px">删除</button>
          ` : ''}
        </div>
      `).join('')}
      </div>
    `;
  } catch(e) {
    el.innerHTML = `<div style="color:var(--danger)">${e.message}</div>`;
  }
}

async function changeRole(uid, role) {
  try {
    await api(`/api/admin/users/${uid}/role`, { method: 'PUT', body: JSON.stringify({ role }) });
    toast('角色已更新');
  } catch(e) { toast(e.message, 'err'); renderAdminUsers(); }
}

async function deleteUser(uid) {
  if (!confirm('确定删除该用户？')) return;
  try {
    await api(`/api/admin/users/${uid}`, { method: 'DELETE' });
    toast('已删除');
    renderAdminUsers();
  } catch(e) { toast(e.message, 'err'); }
}

// ── Modal helpers ─────────────────────────────────────────────────────────────
function closeModal() {
  document.getElementById('linkModal').classList.remove('show');
  document.getElementById('loginModal').classList.remove('show');
}

// ── Search ────────────────────────────────────────────────────────────────────
let searchTimer;
document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.q = this.value.trim();
    loadLinks();
  }, 300);
});

document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const q = this.value.trim();
    if (!q) return;
    // Check if it looks like a URL
    if (/^https?:\/\//i.test(q) || q.includes('.')) {
      window.open(q.startsWith('http') ? q : 'https://' + q, '_blank');
    } else {
      window.open(`https://www.baidu.com/s?wd=${encodeURIComponent(q)}`, '_blank');
    }
  }
});

document.getElementById('extSearchBtn').addEventListener('click', function() {
  const q = document.getElementById('searchInput').value.trim();
  if (q) window.open(`https://www.baidu.com/s?wd=${encodeURIComponent(q)}`, '_blank');
});

// ── Admin tabs ───────────────────────────────────────────────────────────────
document.querySelectorAll('.admin-tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.admin-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    state.currentTab = t.dataset.tab;
    renderAdmin();
  });
});

// ── Header buttons ────────────────────────────────────────────────────────────
document.getElementById('addBtn').addEventListener('click', openAddLink);
document.getElementById('adminBtn').addEventListener('click', () => showAdminPanel(true));
document.getElementById('loginBtn').addEventListener('click', () => openAuth('login'));
document.getElementById('registerBtn').addEventListener('click', () => openAuth('register'));
document.querySelectorAll('.auth-tab').forEach(t => {
  t.addEventListener('click', () => switchAuthTab(t.dataset.tab));
});
document.getElementById('logoutBtn').addEventListener('click', logout);
document.getElementById('changePwBtn').addEventListener('click', openChangePw);
document.getElementById('cancelAuthBtn').addEventListener('click', closeModal);
document.getElementById('cancelLinkBtn').addEventListener('click', closeModal);
document.getElementById('saveLinkBtn').addEventListener('click', saveLink);

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
});

// ── Init ─────────────────────────────────────────────────────────────────────
checkSession();
loadLinks();
</script>
</body>
</html>
